[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boomerang-score-management"
version = "0.1.0"
description = "Modernized IFBA boomerang tournament scoring toolkit"
readme = "README"
requires-python = ">=3.11"
authors = [{name = "Boomerang Community"}]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlmodel>=0.0.16",
    "typer>=0.9",
    "pydantic-settings>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "httpx>=0.27",
]

[project.scripts]
boomerang = "boomerang.cli:app"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
